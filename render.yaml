services:
  - type: web
    name: gerador-de-dds
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    disk:
      name: gerador-dds-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DDS_HOSTED
        value: "1"
      - key: DDS_DATA_DIR
        value: /var/data
      # Conta individual por pessoa; a inicialização falha se os segredos obrigatórios faltarem.
      - key: DDS_ACCOUNT_AUTH
        value: "1"
      - key: DDS_ADMIN_EMAIL
        sync: false
      - key: DDS_SESSION_SECRET
        sync: false
      - key: DDS_ADMIN_PASSWORD
        sync: false
      # O envio de e-mail é opcional no blueprint, mas necessário para avisos automáticos por e-mail.
      - key: DDS_SMTP_HOST
        sync: false
      - key: DDS_SMTP_PORT
        value: "587"
      - key: DDS_SMTP_USER
        sync: false
      - key: DDS_SMTP_PASSWORD
        sync: false
      - key: DDS_SMTP_FROM
        sync: false
