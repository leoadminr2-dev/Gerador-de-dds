name: Verificar Gerador de DDS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar sintaxe Python
        run: python -m py_compile app.py access_control.py tests/test_access_control.py
      - name: Verificar sintaxe JavaScript
        run: node --check web/app.js
      - name: Executar testes de pesquisa, contingência e controle de acesso
        run: python -m unittest discover -s tests -v
