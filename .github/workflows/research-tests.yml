name: Validar pesquisa de temas DDS

on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_research_failure_contract.py'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile app.py tests/test_research_failure_contract.py
      - name: Execute research regression tests
        run: python -m unittest discover -s tests -p 'test_research_failure_contract.py' -v
